name: Accessibility feedback
description: Tell us about a barrier involving controls, text, color, motion or assistive technology.
title: "[Accessibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make PetCompanion more comfortable to use.
        This report is public. You do not need to disclose a diagnosis or medical history. Keep notebook entries, saves and backups private.
  - type: input
    id: version
    attributes:
      label: PetCompanion and Windows versions
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Display mode
      options:
        - Full panel
        - Compact mode
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Relevant tools or settings (optional)
      description: Keyboard navigation, screen reader, magnification, text size, contrast or motion settings. Share only what helps explain the barrier.
  - type: textarea
    id: improvement
    attributes:
      label: What would help?
      description: Optional. A preferred behavior or workaround is useful.
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshots or steps
      description: Remove personal details before attaching anything.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I checked this report and attachments for personal notes, saves, backups and credentials.
          required: true
